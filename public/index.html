<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Last-Mile Dispatch</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#f3f5f0;--ink:#1c382a;--line:#dce3d7;--muted:#84917e;--green:#25623f;--red:#bd4c3e}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.5 'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-weight:600;padding:8px 12px}button:hover{background:#eaf0df}button.primary{background:var(--green);color:white}button:disabled{opacity:.5}input,select{border:1px solid #cad6c2;background:white;padding:8px;border-radius:5px;min-width:0;max-width:100%;color:var(--ink)}label{display:grid;gap:5px;font-size:12px;color:#5e7056}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:16px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}aside{height:100vh;position:sticky;top:0;background:#1c3c2c;color:#e2edda;padding:30px 18px;display:flex;flex-direction:column}.brand{font-size:31px;letter-spacing:-1.5px;font-weight:750}.brand b{background:#d8ea9f;color:#23432e;border-radius:8px;padding:0 7px;margin-right:9px}.caption{font-size:9px;letter-spacing:1.8px;color:#a2b799;margin:9px 0 40px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#bacfb0;text-align:left;padding:12px}.nav button.active{background:#355738;color:#edf4cd}.aside-bottom{margin-top:auto;border-top:1px solid #3c5b3e;padding-top:18px;color:#acc09e;font-size:10px}.topbar{min-height:75px;padding:14px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fafbf7;gap:14px}.eyebrow{font-size:10px;letter-spacing:1.4px;color:#84967c;text-transform:uppercase;font-weight:650}.live{font-size:11px;color:var(--green)}.live:before{content:'● ';color:#78a04c}.login{display:flex;gap:7px}.login input{width:165px;font-size:12px}.user{display:flex;gap:12px;align-items:center;font-size:12px}main{padding:30px;max-width:1700px;margin:auto;min-width:0}.workspace{min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.heading p{color:var(--muted);margin-top:5px}.tag{display:inline-block;font-size:10px;font-weight:650;padding:4px 7px;background:#e8efdc;border-radius:4px;color:#5a7843}.card{background:white;border:1px solid var(--line);border-radius:9px;margin-bottom:18px;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid #e8ede3;gap:10px}.card-body{padding:20px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:20px}.metrics{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:22px 0}.metric{padding:14px;background:white;border:1px solid var(--line);border-radius:7px}.metric:first-child{background:#e5eddb}.metric strong{font-size:27px;display:block;line-height:1.4;letter-spacing:-1px}.metric span{font-size:9px;text-transform:uppercase;color:var(--muted)}.demo{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:14px;background:#eaf0e1;border:1px solid #d2ddc5;border-radius:7px;font-size:12px}.demo button,.demo select{font-size:11px;padding:6px 9px}#map{height:350px;background:#e8eddf}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}th{font-weight:650;font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:#8a9881;background:#fbfcf8}th,td{padding:12px 17px;border-bottom:1px solid #edf0e8;white-space:nowrap}td:first-child{font-weight:600}.badge{display:inline-block;padding:3px 6px;background:#e9f1e1;color:#527542;border-radius:4px;font-size:9px;font-weight:650}.badge.BUSY,.badge.CLAIMED,.badge.PARTIALLY_ASSIGNED,.badge.PICKED_UP{background:#fff0ce;color:#a07522}.badge.INFEASIBLE,.badge.STRANDED,.badge.LOST,.badge.UNRESPONSIVE,.badge.CLOSED{background:#fbe8e0;color:#ba4d3c}.badge.OFFLINE,.badge.CLAIM_EXPIRED,.badge.CANCELLED{background:#eef1eb;color:#89917e}.badge.IN_TRANSIT{background:#e5eef9;color:#4e7295}.feed{max-height:350px;overflow:auto}.event{padding:13px 19px;border-bottom:1px solid #eef1e8;border-left:3px solid #9db383}.event.alert{border-left-color:var(--red)}.event strong{font-size:11px}.event p{font-size:10px;color:var(--muted);margin-top:3px}.empty{text-align:center;padding:40px;color:var(--muted)}.empty strong{display:block;font-size:18px;color:#637555;margin-bottom:7px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}.wide{grid-column:span 2}.flag,.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.mini{font-size:11px;padding:5px 8px}.batch-head{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.batch-head p{font-size:11px;color:var(--muted)}.chips{padding:12px 20px;background:#fafbf6;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px}.banner{padding:13px 17px;background:#fff0ea;border:1px solid #eec9b9;color:#b34637;border-radius:6px;margin:12px 0}.banner.info{background:#edf3e1;border-color:#d2dfbc;color:#52773b}.route{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;background:#f3f6ed;padding:20px;margin:20px 0}.route strong{display:block;font-size:19px}.green{color:var(--green)}.amber{color:#b07619}.red{color:var(--red)}.countdown{font-variant-numeric:tabular-nums}.select-row{margin-bottom:16px;max-width:280px}.welcome{max-width:740px;padding:55px 0}.welcome h1{font-size:49px;line-height:1.2;margin:18px 0}.welcome p{font-size:16px;color:var(--muted)}.welcome .card{margin-top:30px}.footnote{margin-top:24px;font-size:9px;color:#8c9a82;display:flex;justify-content:space-between}#notice{display:none;position:fixed;bottom:25px;right:25px;z-index:2000;max-width:480px;white-space:pre-wrap;padding:15px 20px;background:#1b3d2b;color:white;border-radius:8px}[hidden]{display:none!important}@media(max-width:1100px){.metrics{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}.shell{grid-template-columns:165px 1fr}.login input{width:135px}main{padding:24px}}@media(max-width:720px){.shell{display:block}aside{position:static;height:auto;padding:15px}.caption,.aside-bottom{display:none}.nav{display:flex;overflow:auto;margin-top:12px}.brand{font-size:24px}.topbar{padding:12px 16px;flex-wrap:wrap}.login{flex-wrap:wrap}main{padding:20px 14px}.form-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}.welcome h1{font-size:36px}.metric{padding:9px}.metric strong{font-size:23px}.metrics{gap:5px}.route{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside><div class="brand"><b>↗</b>relay.</div><div class="caption">EVERY MINUTE MATTERS</div><nav id="nav" class="nav" aria-label="Dashboards"></nav><div class="aside-bottom">LAST-MILE AID NETWORK<br>Pune, Maharashtra<p style="margin-top:16px;color:#d7e7a8">Good food. Right place.<br>Just in time.</p></div></aside><div class="workspace"><header class="topbar"><div><span class="eyebrow">Aid coordination platform</span><div class="live" id="connection">Ready to connect</div></div><form id="login" class="login"><input name="email" aria-label="Email" type="email" value="admin@demo.local" placeholder="Email address" required><input name="password" aria-label="Password" type="password" placeholder="Password" required><button class="primary">Sign in →</button></form><div id="user" class="user" hidden><span id="identity"></span><button data-action="logout" class="mini">Sign out</button></div></header><main><div id="panel"></div><footer class="footnote"><span>RELAY / LAST-MILE DISPATCH</span><span id="clockLabel">Deterministic dispatch · Human impact</span></footer></main></div></div><div id="notice" role="status"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const $=s=>document.querySelector(s),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('token'),me=null,cfg={},view='ops',overview=null,lastId=0,offset=0,selectedRider=null,selectedShelter=null,map=null,busy=false,refreshPending=false,debounce,toastTimer,sb,channel,priorDestination=null;
const cats=['COOKED_FOOD','RAW_RATION','INFANT_FORMULA','MEDICAL','KIT'];
function toast(msg){$('#notice').textContent=msg;$('#notice').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#notice').style.display='none',7000)}
function auth(data){token=data.token;sessionStorage.setItem('token',token)}
async function api(path,method='GET',body,headers={}){const response=await fetch('/api'+path,{method,headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body!==undefined?{'Content-Type':'application/json'}:{}),...headers},...(body!==undefined?{body:JSON.stringify(body)}:{})});let data;try{data=await response.json()}catch{data={message:'Request failed'}}if(!response.ok){const err=new Error(data.message||data.code||'Request failed');err.data=data;err.status=response.status;throw err}return data}
const now=()=>Date.now()+offset,color=m=>m>20?'green':m>=5?'amber':'red';
function badge(s){return `<span class="badge ${e(s)}">${e(s.replaceAll('_',' '))}</span>`}
function timer(d){return d?`<span class="countdown" data-deadline="${e(d)}"></span>`:'—'}
function options(rows,id){return rows.map(r=>`<option value="${e(r.id)}" ${String(id)===String(r.id)?'selected':''}>${e(r.name)}</option>`).join('')}
const catOptions=()=>cats.map(c=>`<option>${e(c)}</option>`).join('');
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">No records yet</td></tr>`}</tbody></table></div>`}
const empty=(title,text)=>`<div class="empty"><strong>${e(title)}</strong>${e(text)}</div>`;
function welcome(){$('#panel').innerHTML=`<div class="welcome"><span class="tag">LAST-MILE AID NETWORK</span><h1>Surplus has a destination.<br>Let's get it there.</h1><p>Connect donors, riders and shelters in real time. Deliver perishable aid while it can still make a difference.</p><div class="card"><div class="card-body"><h2>Welcome to Relay</h2><p style="font-size:14px;margin-top:12px">Sign in above to open your dashboard. Demo account: admin@demo.local. Use the password configured in DEMO_PASSWORD.</p></div></div></div>`}
function nav(){$('#nav').innerHTML=(me.role==='admin'?['ops','donor','rider','shelter']:[me.role]).map(v=>`<button data-action="tab" data-view="${v}" class="${view===v?'active':''}">${{ops:'◉  Operations',donor:'↗  Donors',rider:'→  Riders',shelter:'⌂  Shelters'}[v]}</button>`).join('')}
function logout(){token=null;me=null;sessionStorage.removeItem('token');if(sb&&channel)sb.removeChannel(channel);channel=null;overview=null;lastId=0;$('#login').hidden=false;$('#user').hidden=true;$('#nav').innerHTML='';$('#connection').textContent='Signed out';welcome()}
async function start(){cfg=await api('/config');if(!token){welcome();return}try{me=await api('/me');view=me.role==='admin'?'ops':me.role;$('#login').hidden=true;$('#user').hidden=false;$('#identity').textContent=me.role.toUpperCase()+' / '+(me.entity_id??'OPS');nav();await refresh();connect()}catch(err){logout();toast(err.message)}}
async function refresh(){
    if(!me)return;
    if(busy){refreshPending=true;return}
    busy=true;
    const requestedView=view, requestedUser=me.user_id;
    try{
        if(me.role==='admin'){
            overview=await api('/admin/overview');
            offset=new Date(overview.now)-Date.now();
            selectedRider=selectedRider||overview.riders[0]?.id;
            selectedShelter=selectedShelter||overview.shelters[0]?.id;
        }else{
            const profile=await api('/me');
            if(profile.now)offset=new Date(profile.now)-Date.now();
        }
        if(!me||me.user_id!==requestedUser)return;
        const riderId=me.role==='admin'?selectedRider:me.entity_id;
        const shelterId=me.role==='admin'?selectedShelter:me.entity_id;
        // Keep the existing card mounted until all data for its replacement is ready.
        let data;
        if(requestedView==='donor')data=me.role==='admin'?overview.batches:await api('/batches');
        if(requestedView==='rider'&&riderId)data=await api('/riders/'+riderId+'/assignment');
        if(requestedView==='shelter'&&shelterId)data=await Promise.all([api('/shelters/'+shelterId),api('/shelters/'+shelterId+'/incoming')]);
        if(!me||me.user_id!==requestedUser)return;
        if(view!==requestedView||(me.role==='admin'&&((requestedView==='rider'&&riderId!==selectedRider)||(requestedView==='shelter'&&shelterId!==selectedShelter)))){
            refreshPending=true;
            return;
        }
        if(map){map.remove();map=null}
        const names={ops:['Operations console','A live picture of aid moving through the city.'],donor:['Donor dispatch','Track every unit, every handoff.'],rider:['Your delivery','A clear route. A safe handoff.'],shelter:['Shelter coordination','Keep demand current so the right aid reaches your door.']};
        $('#panel').innerHTML=`<div class="heading"><div><span class="eyebrow">${view==='ops'?'Network overview':'Your workspace'}</span><h1>${names[view][0]}</h1><p>${names[view][1]}</p></div><span class="tag">${me.role==='admin'?'OPS / LIVE':e(me.role.toUpperCase())}</span></div><div id="content"></div>`;
        if(view==='ops')drawOps();
        if(view==='donor')drawDonor(data);
        if(view==='rider')drawRider(data,riderId);
        if(view==='shelter')drawShelter(data,shelterId);
        tick();
    }catch(err){toast(err.message)}finally{
        busy=false;
        if(refreshPending){refreshPending=false;queueMicrotask(refresh)}
    }
}
function demoBar(){return cfg.demo_mode?`<div class="demo"><strong>Demo controls</strong><button data-action="seed">↻ Seed</button><select id="scenario" aria-label="Scenario"><option value="main">Main · 180 meals</option><option value="tight">Tight · insulin</option><option value="compat">Compatibility</option></select><button class="primary" data-action="scenario">Run scenario</button>${[1,5,15].map(n=>`<button data-action="time" data-minutes="${n}">+${n} min</button>`).join('')}<button data-action="accept">Accept all riders</button><button data-action="resetclock">Reset clock</button></div>`:''}
function drawOps(){const d=overview;$('#content').innerHTML=demoBar()+`<div class="metrics">${Object.entries(d.kpis).map(([k,v])=>`<div class="metric"><span>${e(k.replaceAll('_',' '))}</span><strong class="${v&&['stranded','lost','wasted'].includes(k)?'red':''}">${e(v)}</strong></div>`).join('')}</div><div class="grid"><div class="card"><div class="card-head"><h2>Dispatch network</h2><small>● Donors · ● Riders · ● Shelters</small></div><div id="map" aria-label="Dispatch map"></div></div><div class="card"><div class="card-head"><h2>Activity stream</h2><span class="live">LIVE</span></div><div class="feed">${d.events.map(x=>`<div class="event ${['STRANDED','SPOILED','RIDER_SILENT','BATCH_INFEASIBLE'].includes(x.event_type)?'alert':''}"><strong>${e(x.event_type.replaceAll('_',' '))}</strong><p>${e(x.entity_type)} #${e(x.entity_id??'—')} · ${e(new Date(x.ts).toLocaleTimeString())}${x.payload.quantity?' · '+e(x.payload.quantity)+' units':''}${x.payload.reason?' · '+e(x.payload.reason):''}</p></div>`).join('')||empty('All quiet','Seed the network and run a scenario.')}</div></div></div><div class="grid"><div class="card"><div class="card-head"><h2>Rider fleet</h2><small>${d.riders.length} volunteers</small></div>${table(['Rider','Capacity','Status','Heartbeat','Controls'],d.riders.map(r=>`<tr><td>${e(r.name)}</td><td>${r.capacity_units}</td><td>${badge(r.status)}</td><td>${Math.max(0,Math.round((now()-new Date(r.last_heartbeat_at))/1000))}s ago</td><td><button class="mini" data-action="online" data-id="${r.id}" data-on="${['OFFLINE','UNRESPONSIVE'].includes(r.status)}">${['OFFLINE','UNRESPONSIVE'].includes(r.status)?'Online':'Offline'}</button> ${cfg.demo_mode?`<button class="mini" data-action="silence" data-id="${r.id}" data-on="${!r.demo_silenced}">${r.demo_silenced?'Unsilence':'Silence'}</button>`:''}</td></tr>`))}</div><div class="card"><div class="card-head"><h2>Shelter capacity</h2><small>Live demand</small></div>${table(['Shelter','Status','Open units','Actions'],d.shelters.map(s=>`<tr><td>${e(s.name)}</td><td>${badge(s.status)}</td><td>${s.demands.reduce((n,x)=>n+x.open_capacity,0)}</td><td><button class="mini" data-action="shelter-toggle" data-id="${s.id}" data-open="${s.status==='CLOSED'}">${s.status==='OPEN'?'Close':'Open'}</button> <button class="mini" data-action="shelter-view" data-id="${s.id}">Manage</button></td></tr>`))}</div></div><div class="card"><div class="card-head"><h2>Active deliveries</h2></div>${table(['ID','Item','Rider','Destination','Units','Status','Deliver by'],d.assignments.map(a=>`<tr><td>#${a.id}</td><td>${e(a.item_name)}</td><td>${e(a.rider_name)}</td><td>${e(a.destination?.name||'⚠ Stranded')}</td><td>${a.quantity}</td><td>${badge(a.status)}</td><td>${timer(a.deliver_by)}</td></tr>`))}</div>${d.batches.filter(b=>b.status==='INFEASIBLE').map(b=>`<div class="banner">Batch #${b.id} · ${e(b.item_name)} · INFEASIBLE · ${e(b.reasons.join(', '))}</div>`).join('')}`;drawMap()}
function drawMap(){if(!window.L)return;map=L.map('map',{scrollWheelZoom:false}).setView([18.524,73.855],12);// OSM requires a real Referer. Override the app's no-referrer policy only
// for tile images, sharing the page origin without its path or query string.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    referrerPolicy:'strict-origin-when-cross-origin',
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
}).addTo(map);const points=[];for(const [key,c] of [['donors','#a19449'],['riders','#4e7499'],['shelters','#3b7852']])for(const p of overview[key]){points.push([p.lat,p.lng]);const label=document.createElement('span');label.textContent=p.name+(p.status?' · '+p.status:'');L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).addTo(map).bindPopup(label)}for(const a of overview.assignments){const r=overview.riders.find(r=>r.id===a.rider_id);if(r&&a.destination)L.polyline([[r.lat,r.lng],[a.destination.lat,a.destination.lng]],{color:'#5e8858',weight:2,dashArray:'5 7'}).addTo(map)}if(points.length)map.fitBounds(points,{padding:[30,30],maxZoom:13})}
function drawDonor(batches){$('#content').innerHTML=`<div class="card"><div class="card-head"><h2>Create a donation batch</h2><span class="tag">SAFE DISPATCH</span></div><form id="batchForm" class="card-body form-grid">${me.role==='admin'?`<label>Donor<select name="donor_id" required>${options(overview.donors,null)}</select></label>`:''}<label>Category<select name="category">${catOptions()}</select></label><label class="wide">Item name<input name="item_name" maxlength="120" placeholder="e.g. Veg Biryani" required></label><label>Quantity<input name="quantity_total" type="number" min="1" max="5000" value="180" required></label><label>Ready in (min)<input name="ready_in_min" type="number" min="0" max="720" value="0" required></label><label>Expires in (min)<input name="expires_in_min" type="number" min="1" max="1440" value="75" required></label><label>Safety buffer (min)<input name="safety_buffer_min" type="number" min="0" max="60" value="10" required></label><label class="flag"><input name="cold_chain" type="checkbox"> Needs refrigeration</label><label class="flag"><input name="auto_dispatch" type="checkbox" checked> Dispatch automatically</label><button class="primary">Create batch →</button></form></div>${batches.map(b=>`<div class="card"><div class="batch-head"><div><h2>${e(b.item_name)} ${badge(b.status)}</h2><p>Batch #${b.id} · ${e(b.category)} · ${b.quantity_total} units${b.is_recovery?' · RECOVERY':''}</p></div><div>Expiry ${timer(b.expires_at)}</div></div>${b.status==='INFEASIBLE'?`<div class="banner">No safe delivery plan: ${e(b.reasons.join(', '))}</div>`:''}${table(['Rider','Destination','Units','Status','Slack'],b.assignments.map(a=>`<tr><td>${e(a.rider_name)}</td><td>${e(a.destination?.name||'—')}</td><td>${a.quantity}</td><td>${badge(a.status)}</td><td class="${color(a.slack_min)}">${a.slack_min==null?'—':a.slack_min.toFixed(1)+' min'}</td></tr>`))}<div class="chips"><strong>${b.quantity_unassigned} unassigned</strong>${b.reasons.map(r=>`<span class="tag">${e(r)}</span>`).join('')}<span class="muted">${b.quantity_wasted} wasted · ${b.quantity_lost} lost</span><div class="actions" style="margin-left:auto"><button class="mini" data-action="plan" data-id="${b.id}">Preview plan</button><button class="mini primary" data-action="dispatch" data-id="${b.id}">Dispatch</button></div></div></div>`).join('')||empty('No donation batches yet','Create a batch to find a safe delivery plan.')}`}
function drawRider(data,id){if(!id){$('#content').innerHTML=empty('No riders','Seed the network first.');return}const {rider:r,assignment:a}=data;if(a&&priorDestination?.id===a.id&&priorDestination.shelter!==a.shelter_id)toast('Re-routed to '+(a.destination?.name||'no destination — cargo stranded'));priorDestination=a?{id:a.id,shelter:a.shelter_id}:null;$('#content').innerHTML=(me.role==='admin'?`<div class="select-row"><label>Rider<select id="riderSelect">${options(overview.riders,id)}</select></label></div>`:'')+`<div class="card"><div class="card-head"><h2>${e(r.name)} ${badge(r.status)}</h2><button data-action="online" data-id="${r.id}" data-on="${['OFFLINE','UNRESPONSIVE'].includes(r.status)}">${['OFFLINE','UNRESPONSIVE'].includes(r.status)?'Go online':'Go offline'}</button></div><div class="card-body">${a?`<div class="heading"><div><span class="eyebrow">Assignment #${a.id}</span><h1>${e(a.item_name)}</h1><p>${a.quantity} units · ${e(a.category)}</p></div>${badge(a.status)}</div>${a.status==='STRANDED'?'<div class="banner">⚠ Cargo stranded. Awaiting a safe destination.</div>':''}${a.reroute_count?`<div class="banner info">Re-routed to ${e(a.destination?.name||'destination pending')} · ${a.reroute_count} route changes</div>`:''}<div class="route"><div><small>Collect from</small><strong>Donor pickup point</strong><span class="muted">${e(a.pickup.lat)}, ${e(a.pickup.lng)}</span></div><span>→</span><div><small>Deliver to</small><strong>${e(a.destination?.name||'Awaiting destination')}</strong><span class="muted">${e(a.destination?.lat??'—')}, ${e(a.destination?.lng??'—')}</span></div></div><p>Claim expires ${timer(a.claim_expires_at)} · Deliver by ${timer(a.deliver_by)}</p><div class="actions" style="margin-top:20px">${({CLAIMED:['pickup','cancel'],PICKED_UP:['depart'],IN_TRANSIT:['deliver']}[a.status]||[]).map(step=>`<button class="${step==='cancel'?'':'primary'}" data-action="assignment" data-step="${step}" data-id="${a.id}">${step.charAt(0).toUpperCase()+step.slice(1)}</button>`).join('')}</div>`:empty('Ready for your next delivery','Stay online. Your next safe assignment appears automatically.')}</div></div>`}
function drawShelter(data,id){if(!id){$('#content').innerHTML=empty('No shelters','Seed the network first.');return}const [s,incoming]=data;$('#content').innerHTML=(me.role==='admin'?`<div class="select-row"><label>Shelter<select id="shelterSelect">${options(overview.shelters,id)}</select></label></div>`:'')+`<div class="card"><div class="card-head"><h2>${e(s.name)} ${badge(s.status)}</h2><button data-action="shelter-toggle" data-id="${id}" data-open="${s.status==='CLOSED'}">${s.status==='OPEN'?'Close shelter':'Open shelter'}</button></div><div class="card-body actions">${[['has_clean_water','Clean water'],['has_cooking_fuel','Cooking fuel'],['has_refrigeration','Refrigeration']].map(([key,label])=>`<label class="flag"><input type="checkbox" data-flag="${key}" data-id="${id}" ${s[key]?'checked':''}>${label}</label>`).join('')}</div>${table(['Category','Required','Received','In transit','Open','Update'],s.demands.map(d=>`<tr><td>${e(d.category)}</td><td>${d.required}</td><td>${d.received}</td><td>${d.in_transit}</td><td>${d.open_capacity}</td><td><form class="demandForm actions" data-id="${id}" data-category="${e(d.category)}"><input name="required" type="number" min="0" value="${d.required}" style="width:85px" required><button class="mini">Save</button></form></td></tr>`))}</div><div class="grid"><div class="card"><div class="card-head"><h2>Walk-in donation</h2></div><form id="walkInForm" data-id="${id}" class="card-body form-grid"><label class="wide">Category<select name="category">${catOptions()}</select></label><label>Units<input name="quantity" type="number" min="1" max="5000" value="50" required></label><button class="primary">Record donation</button></form></div><div class="card"><div class="card-head"><h2>Add category demand</h2></div><form id="newDemand" data-id="${id}" class="card-body form-grid"><label class="wide">Category<select name="category">${catOptions()}</select></label><label>Required<input name="required" type="number" min="0" value="40" required></label><button>Save demand</button></form></div></div><div class="card"><div class="card-head"><h2>Incoming deliveries</h2></div>${table(['Item','Rider','Units','Status','ETA'],incoming.map(a=>`<tr><td>${e(a.item_name)}</td><td>${e(a.rider_name)} ${badge(a.rider_status)}</td><td>${a.quantity}</td><td>${badge(a.status)}</td><td>${a.eta?e(new Date(a.eta).toLocaleTimeString()):'—'}</td></tr>`))}</div>`}
async function act(b){const a=b.dataset.action,id=b.dataset.id;if(a==='logout'){logout();return}if(a==='tab'){view=b.dataset.view;nav();await refresh();return}if(a==='shelter-view'){selectedShelter=Number(id);view='shelter';nav();await refresh();return}b.disabled=true;try{let result;if(a==='seed'){result=await api('/demo/seed','POST');auth(result);lastId=0;selectedRider=selectedShelter=null;toast('Network reset. Ready for a scenario.')}if(a==='scenario')result=await api('/demo/batches/'+$('#scenario').value,'POST');if(a==='time')result=await api('/demo/time-travel','POST',{minutes:Number(b.dataset.minutes)});if(a==='accept')result=await api('/demo/riders/accept-all','POST');if(a==='resetclock')result=await api('/demo/reset-clock','POST');if(a==='silence')result=await api('/demo/riders/'+id+'/silence','POST',{on:b.dataset.on==='true'});if(a==='online')result=await api('/riders/'+id+'/status','POST',{online:b.dataset.on==='true'});if(a==='shelter-toggle')result=await api('/shelters/'+id+'/'+(b.dataset.open==='true'?'open':'close'),'POST');if(a==='assignment')result=await api('/assignments/'+id+'/'+b.dataset.step,'POST');if(a==='plan'){result=await api('/batches/'+id+'/plan','POST');toast('Preview: '+result.slices.map(x=>`${x.quantity} units → shelter #${x.shelter_id}`).join('; ')+`\n${result.unfulfilled} unfulfilled. ${result.reasons.join(', ')}`)}if(a==='dispatch')result=await api('/batches/'+id+'/dispatch','POST',undefined,{'Idempotency-Key':crypto.randomUUID()});if(result?.now)offset=new Date(result.now)-Date.now()}catch(err){showError(err)}finally{b.disabled=false;await refresh()}}
function showError(err){if(err.data?.batches)toast(err.data.batches.map(b=>`${b.item_name}: ${b.reasons.join(', ')}. Best-case ETA ${b.best_case_eta_min??'—'} min`).join('\n'));else toast(err.message+(err.data?.reasons?' · '+err.data.reasons.join(', '):'')+(err.data?.best_case_eta_min?' · Best-case ETA '+err.data.best_case_eta_min+' min':''))}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b)act(b)});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.id==='riderSelect'){selectedRider=Number(t.value);await refresh()}if(t.id==='shelterSelect'){selectedShelter=Number(t.value);await refresh()}if(t.dataset.flag){try{await api('/shelters/'+t.dataset.id+'/flags','PUT',{[t.dataset.flag]:t.checked})}catch(err){showError(err)}await refresh()}});
document.addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target,b=f.querySelector('button'),data=Object.fromEntries(new FormData(f));if(b)b.disabled=true;try{if(f.id==='login'){auth(await api('/auth/login','POST',data));f.elements.password.value='';await start();return}if(f.id==='batchForm'){for(const k of ['donor_id','quantity_total','ready_in_min','expires_in_min','safety_buffer_min'])if(k in data)data[k]=Number(data[k]);data.cold_chain=f.elements.cold_chain.checked;data.auto_dispatch=f.elements.auto_dispatch.checked;await api('/batches','POST',data,{'Idempotency-Key':crypto.randomUUID()});toast('Donation batch created')}if(f.classList.contains('demandForm'))await api('/shelters/'+f.dataset.id+'/demand','PUT',{category:f.dataset.category,required:Number(data.required)});if(f.id==='newDemand')await api('/shelters/'+f.dataset.id+'/demand','PUT',{category:data.category,required:Number(data.required)});if(f.id==='walkInForm')await api('/shelters/'+f.dataset.id+'/walk-in','POST',{category:data.category,quantity:Number(data.quantity)})}catch(err){showError(err)}finally{if(b)b.disabled=false;if(me)await refresh()}});
function onEvent(ev){lastId=Math.max(lastId,Number(ev.id)||0);if(ev.event_type==='STRANDED')toast('⚠ Assignment #'+ev.entity_id+' stranded. No safe fallback.');clearTimeout(debounce);debounce=setTimeout(refresh,300)}
async function connect(){if(sb&&channel)sb.removeChannel(channel);channel=null;if(cfg.supabase_url&&cfg.supabase_anon_key){try{if(!window.supabase)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.append(s)});sb=window.supabase.createClient(cfg.supabase_url,cfg.supabase_anon_key);channel=sb.channel('live').on('postgres_changes',{event:'INSERT',schema:'public',table:'events'},p=>onEvent(p.new)).subscribe(status=>$('#connection').textContent=status==='SUBSCRIBED'?'Realtime connected':'Polling fallback')}catch{$('#connection').textContent='Polling fallback'}}else $('#connection').textContent='Live · polling every 2s'}
setInterval(async()=>{if(!me)return;try{for(const ev of await api('/events?since='+lastId))onEvent(ev)}catch(err){if(err.status===401){logout();toast('Session expired. Sign in again.')}}},2000);
setInterval(()=>{if(me&&!document.hidden&&!document.querySelector('form input:focus,form select:focus'))refresh()},5000);
setInterval(async()=>{if(!me)return;try{let riders;if(me.role==='admin'&&cfg.demo_mode)riders=overview?.riders.filter(r=>['AVAILABLE','BUSY'].includes(r.status))||[];else if(me.role==='rider')riders=[(await api('/riders/'+me.entity_id+'/assignment')).rider];else return;for(const r of riders)await api('/riders/'+r.id+'/heartbeat','POST',{lat:r.lat,lng:r.lng})}catch{}},15000);
function tick(){for(const el of document.querySelectorAll('[data-deadline]')){const sec=Math.max(0,Math.round((new Date(el.dataset.deadline)-now())/1000));el.textContent=`${Math.floor(sec/60)}m ${String(sec%60).padStart(2,'0')}s`;el.className='countdown '+color(sec/60)}$('#clockLabel').textContent=new Date(now()).toLocaleString()+' · Pune network'}
setInterval(tick,1000);start().catch(err=>{welcome();toast(err.message)});
</script></body></html>
